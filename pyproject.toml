[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-tracker"
version = "0.1.0"
description = "Local Windows desktop tracker for anime planned for Jellyfin"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "winotify>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

